# fly.toml app configuration file generated for gas-cylinders-tracking on 2026-10-24T15:40:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'gas-cylinders-tracking'
primary_region = 'sin'

[build]

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
